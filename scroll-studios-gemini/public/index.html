<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Studios - Demo Avior</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Segoe UI, sans-serif; }
    body { background-color: #0b141a; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 450px; height: 90vh; background: #111b21; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .header { background: #202c33; padding: 15px; color: #e9edef; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222d34; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #0b141a; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; color: #e9edef; word-wrap: break-word; }
    .bot { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
    .user { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
    .input-area { padding: 12px; background: #202c33; display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a3942; color: white; outline: none; }
    button { padding: 12px 18px; border-radius: 8px; border: none; background: #00a884; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #029071; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="header">
      <div class="avatar">S</div>
      <div>
        <h4 style="margin:0;">Sofi | Avior Agent</h4>
        <small style="color: #8696a0;">Scroll Studios (En línea)</small>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">¡Hola! 👋 Soy Sofi de Scroll Studios. ¿Cómo puedo ayudarte hoy con tu negocio?</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Escribe un mensaje..." onkeypress="handleKey(event)">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        
        const data = await res.json();
        
        // Verificación para evitar 'undefined'
        if (data && data.reply) {
          addMessage(data.reply, 'bot');
        } else {
          addMessage('Sofi está procesando muchas consultas. Por favor reintenta en un momento. ⌛', 'bot');
        }
      } catch (err) {
        addMessage('Error de conexión con el servidor. Revisa tu terminal.', 'bot');
      }
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.classList.add('message', sender);
      div.innerText = text;
      const container = document.getElementById('messages');
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
